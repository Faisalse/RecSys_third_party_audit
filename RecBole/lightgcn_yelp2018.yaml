# mydata_ngcf.yaml

data_path: dataset/lightgcn/
dataset: yelp2018

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id

field_separator: "\t"

load_col:
  inter: [user_id, item_id]

benchmark_filename: [train, valid, test]
eval_step: 5000
stopping_step: 5000
# evaluation
eval_args:
  group_by: user
  order: RO
  mode: full

# metrics
metrics: ['Recall', 'NDCG']
topk: [10, 20]
valid_metric: Recall@20
metric_decimal_place: 4

neg_sampling:
  distribution: uniform     # or: popularity
  sample_num: 1             # number of negatives per positive
  alpha: 1.0                # only used for popularity (often safe to keep)
  dynamic: False            # optional; dynamic sampling is separate
  candidate_num: 0


# NGCF hyperparameters
learning_rate: 0.001
embedding_size: 64
hidden_size_list: [64, 64, 64]
node_dropout: 0.1
message_dropout: 0.1
reg_weight: 1e-4
learner: adam

# training
epochs: 1000
train_batch_size: 2048

# --dataset yelp2018 --regs [1e-4] --embed_size 64 --layer_size [64,64,64] --lr 0.001 --batch_size 2048 --epoch 1000
