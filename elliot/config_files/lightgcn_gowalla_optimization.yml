experiment:
  path_output_rec_result: results/lightgcn/gowalla/
  path_output_rec_performance: results/lightgcn/gowalla/
  dataset: gowalla
  data_config:
    strategy: fixed
    train_path: ../data/lightgcn/{0}/train.tsv
    test_path: ../data/lightgcn/{0}/test.tsv
  binarize: True
  top_k: 50
  evaluation:
    cutoffs: [10, 20]
    simple_metrics: [Recall, nDCG]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    LightGCN:
      meta:
        hyper_max_evals: 20
        hyper_opt_alg: tpe
        verbose: True
        save_recs: True
      lr: [loguniform, -11.512925464970229, 0]
      epochs: [300, 400, 1000]
      batch_size: [64, 128, 256, 512]
      factors: [8, 16, 32, 64, 128]
      n_layers: [1]
      l_w: [loguniform, -11.512925464970229, 0]
      