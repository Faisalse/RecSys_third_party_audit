experiment:
  path_output_rec_result: results/with_HP_tuning/lightgcn/gowalla/
  path_output_rec_performance: results/with_HP_tuning/lightgcn/gowalla/

  dataset: gowalla
  backend: pytorch
  
  data_config:
    strategy: fixed
    train_path: ../data/lightgcn/tuning/{0}/train.tsv
    validation_path: ../data/lightgcn/tuning/{0}/valid.tsv
    test_path: ../data/lightgcn/tuning/{0}/test.tsv

  binarize: True
  top_k: 50

  evaluation:
    cutoffs: [10, 20]
    simple_metrics: [nDCG, Recall]

  external_models_path: ../external/models/__init__.py
  gpu: 0

  models:
    external.LightGCN:

      meta:
        hyper_max_evals: 30
        hyper_opt_alg: tpe
        validation_metric: Recall@20
        validation_rate: 1
        verbose: True
        save_recs: True

      lr: [0.01,0.005,0.001,0.0005,0.0001]
      epochs: 1000
      batch_size: 2048
      factors: [8, 16, 32, 64]
      n_layers: [1, 2, 3, 4]
      l_w: [0.00001, 0.0001, 0.001, 0.01]

      early_stopping:
        patience: 10
        monitor: Recall@20
        mode: max
        verbose: True
        min_delta: 0.001
