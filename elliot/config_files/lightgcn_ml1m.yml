experiment:
  path_output_rec_result: results/lightgcn/movielens_1m/
  path_output_rec_performance: results/lightgcn/movielens_1m/
  dataset: movielens_1m
  backend: pytorch
  data_config:
    strategy: dataset
    dataset_path: ../data/{0}/dataset.tsv
  splitting:
    test_splitting:
        strategy: random_subsampling
        test_ratio: 0.1
  top_k: 10
  evaluation:
    cutoffs: [10]
    simple_metrics: [nDCG,Recall,HR]
  external_models_path: ../external/models/__init__.py
  gpu: 0
  models:
    external.LightGCN:
      meta:
        save_recs: True
      lr: 0.001
      epochs: 1
      factors: 256
      batch_size: 8192
      l_w: 0.001
      n_layers: 2