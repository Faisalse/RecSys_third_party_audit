experiment:
  dataset: movielens_1m
  data_config:
    strategy: dataset
    dataset_path: ../data/{0}/dataset.tsv
  prefiltering:
    - strategy: global_threshold
      threshold: 4
    - strategy: iterative_k_core
      core: 10
  binarize: True
  splitting:
    save_folder: ../data/{0}/splitting/
    test_splitting:
      test_ratio: 0.2
      strategy: random_subsampling
      folds: 1
  top_k: 50
  evaluation:
    cutoffs: [10, 20, 50]
    simple_metrics: [nDCG, MAP, MRR, Precision, Recall,F1,HR]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    NGCF:
      meta:
        hyper_max_evals: 1
        hyper_opt_alg: tpe
        verbose: True
      early_stopping:
        patience: 10
        monitor: Recall@20
        validation_rate: 1
        mode: max
        verbose: True
        min_delta: 0.001
      lr: [0.01, 0.005, 0.001, 0.0005, 0.0001]
      epochs: [50, 100, 200, 300]
      factors: [32, 64, 128]
      batch_size: [64, 128, 256, 512]
      l_w: [0.00001, 0.0001, 0.001, 0.01]

      weight_size: (64, 64, 64)
      node_dropout: (0.1, 0.1, 0.1)
      message_dropout: (0.1, 0.1, 0.1)