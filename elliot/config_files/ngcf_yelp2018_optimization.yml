experiment:
  path_output_rec_result: results/ngcf/gowalla/
  path_output_rec_performance: results/ngcf/gowalla/
  dataset: gowalla
  data_config:
    strategy: fixed
    train_path: ../data/ngcf/tuning/{0}/train.tsv
    validation_path: ../data/ngcf/tuning/{0}/valid.tsv
    test_path: ../data/ngcf/tuning/{0}/test.tsv
  binarize: True
  top_k: 50
  evaluation:
    cutoffs: [20]
    simple_metrics: [Recall]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    NGCF:
      meta:
        hyper_max_evals: 25
        hyper_opt_alg: tpe
        verbose: True
      early_stopping:
        patience: 10
        monitor: Recall@20
        validation_rate: 1
        mode: auto
        verbose: True
        min_delta: 0.001
      lr: [0.01, 0.005, 0.001, 0.0005, 0.0001]
      epochs: [50, 100,  200, 300, 400, 500, 1000]
      factors: [32, 64, 128]
      batch_size: [512]
      l_w: [0.00001, 0.0001, 0.001, 0.01]
      weight_size: (64,)
      node_dropout: (0.1,)
      message_dropout: (0.1,0.1,0.1)
      n_fold: 5    