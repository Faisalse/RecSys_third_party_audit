experiment:
  path_output_rec_result: results/ngcf/gowalla/
  path_output_rec_performance: results/ngcf/gowalla/
  dataset: gowalla
  data_config:
    strategy: fixed
    train_path: ../data/ngcf/{0}/train.tsv
    valid_path: ../data/ngcf/{0}/valid.tsv
    test_path: ../data/ngcf/{0}/test.tsv
  binarize: True
  top_k: 50
  evaluation:
    cutoffs: [20]
    simple_metrics: [Recall]
  gpu: 0
  external_models_path: ../external/models/__init__.py
  models:
    NGCF:
      meta:
        hyper_max_evals: 10
        hyper_opt_alg: tpe
        verbose: True
        save_recs: True
      lr: [0.01,0.005,0.001,0.0005,0.0001]
      epochs: [50, 100,  200, 300, 400, 500, 1000]
      batch_size: [256]
      factors: [64, 128, 256, 512]
      l_w: [1e-05,1e-04,1e-03,1e-02]
      node_dropout: [[0.0], [0.1], [0.2], [0.3], [0.4]]
      message_dropout: [[0.0], [0.1], [0.2], [0.3], [0.4]]
    